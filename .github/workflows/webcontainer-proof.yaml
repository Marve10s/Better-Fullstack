name: WebContainer Proof

on:
  pull_request:
  push:
    branches: [development, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webcontainer-proof-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  boot-edit-rerun:
    name: Real boot, edit, and rerun
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build browser generator packages
        run: |
          bun run --cwd packages/types build
          bun run --cwd packages/template-generator build

      - name: Install Chromium
        run: bunx playwright install chromium --with-deps

      - name: Run real WebContainer contract
        working-directory: apps/web
        run: bunx playwright test --grep @webcontainer-proof

      - name: Upload proof diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webcontainer-proof-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: ignore
