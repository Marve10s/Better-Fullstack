name: Dependency Version Check

on:
  schedule:
    # Run every Monday at 9am UTC
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      update_mode:
        description: "Update mode"
        type: choice
        options:
          - check-only
          - patch-minor
          - all
        default: "check-only"
      ecosystem:
        description: "Specific ecosystem to check (leave empty for all)"
        required: false
        type: string

concurrency:
  group: deps-check
  cancel-in-progress: true

jobs:
  check-versions:
    name: Check Dependency Versions
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
    outputs:
      has_major_updates: ${{ steps.check.outputs.has_major_updates }}
      major_packages: ${{ steps.check.outputs.major_packages }}
      has_pr_changes: ${{ steps.pending.outputs.has_changes }}
      smoke_force_flags: ${{ steps.smoke-flags.outputs.force_flags }}
      pull_request_number: ${{ steps.cpr.outputs.pull-request-number }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.bun/install/cache
          key: deps-check-${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            deps-check-${{ runner.os }}-bun-

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Build Template Generator
        run: |
          cd packages/types && bun run build
          cd ../template-generator && bun run build

      - name: Run Version Check
        id: check
        run: |
          cd packages/template-generator

          # Scheduled runs apply compatible patch/minor updates. Majors require
          # an explicit policy allowlist and a manual `all` dispatch.
          EFFECTIVE_UPDATE_MODE="${{ inputs.update_mode }}"
          if [ -z "$EFFECTIVE_UPDATE_MODE" ]; then
            if [ "${{ github.event_name }}" = "schedule" ]; then
              EFFECTIVE_UPDATE_MODE="patch-minor"
            else
              EFFECTIVE_UPDATE_MODE="check-only"
            fi
          fi
          echo "effective_update_mode=$EFFECTIVE_UPDATE_MODE" >> "$GITHUB_OUTPUT"

          # Run the check script
          if [ -n "${{ inputs.ecosystem }}" ]; then
            bun run scripts/check-deps.ts --markdown --ecosystem "${{ inputs.ecosystem }}" > ../deps-report.md || true
          else
            bun run scripts/check-deps.ts --markdown > ../deps-report.md || true
          fi

          # Fallback if script output wasn't written for any reason.
          if ! grep -q "^has_updates=" "$GITHUB_OUTPUT"; then
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
          fi
          if ! grep -q "^downgrade_count=" "$GITHUB_OUTPUT"; then
            echo "downgrade_count=0" >> "$GITHUB_OUTPUT"
          fi
          if ! grep -q "^has_major_updates=" "$GITHUB_OUTPUT"; then
            echo "has_major_updates=false" >> "$GITHUB_OUTPUT"
          fi
          if ! grep -q "^blocked_major_count=" "$GITHUB_OUTPUT"; then
            echo "blocked_major_count=0" >> "$GITHUB_OUTPUT"
          fi
          if ! grep -q "^major_packages=" "$GITHUB_OUTPUT"; then
            echo "major_packages=" >> "$GITHUB_OUTPUT"
          fi

      - name: Display Report
        run: |
          echo "## Dependency Check Report"
          cat packages/deps-report.md

      - name: Apply Updates (if requested)
        if: steps.check.outputs.effective_update_mode == 'patch-minor' || steps.check.outputs.effective_update_mode == 'all'
        run: |
          cd packages/template-generator

          if [ "${{ steps.check.outputs.effective_update_mode }}" == "patch-minor" ]; then
            bun run scripts/check-deps.ts --apply-patch || true
          else
            bun run scripts/check-deps.ts --apply-all || true
          fi

      - name: Sync Templates And Verification Artifacts
        if: steps.check.outputs.effective_update_mode == 'patch-minor' || steps.check.outputs.effective_update_mode == 'all'
        run: |
          bun run --cwd packages/template-generator sync-versions:fix
          bun run --cwd packages/template-generator sync-versions
          bun run --cwd packages/types build
          bun run --cwd packages/template-generator build
          bun test apps/cli/test/template-snapshots.test.ts -u
          bun test apps/cli/test/cli-builder-sync.test.ts
          bun test apps/cli/test/dependency-version-channel.test.ts
          bun test apps/cli/test/generated-command-contract.test.ts
          bun test apps/web/test/preview-config.test.ts

      - name: Run Repository Verification
        id: full-tests
        if: steps.check.outputs.effective_update_mode == 'patch-minor' || steps.check.outputs.effective_update_mode == 'all'
        run: |
          set +e
          bun run lint 2>&1 | tee "$RUNNER_TEMP/lint.log"
          LINT_EXIT_CODE=${PIPESTATUS[0]}
          bun run test 2>&1 | tee "$RUNNER_TEMP/test.log"
          TEST_EXIT_CODE=${PIPESTATUS[0]}
          set -e
          cat "$RUNNER_TEMP/lint.log" "$RUNNER_TEMP/test.log" > "$RUNNER_TEMP/full-test.log"
          if [ "$LINT_EXIT_CODE" -eq 0 ] && [ "$TEST_EXIT_CODE" -eq 0 ]; then
            echo "exit_code=0" >> "$GITHUB_OUTPUT"
          else
            echo "exit_code=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Capture Test Verification Report
        id: test-report
        if: steps.check.outputs.effective_update_mode == 'patch-minor' || steps.check.outputs.effective_update_mode == 'all'
        run: |
          bun run .github/scripts/format-test-report.ts \
            "$RUNNER_TEMP/full-test.log" \
            "${{ steps.full-tests.outputs.exit_code }}" \
            '`bun run lint` and `bun run test`' > "$RUNNER_TEMP/test-verification.md"
          {
            echo 'report<<EOF'
            cat "$RUNNER_TEMP/test-verification.md"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Derive Targeted Smoke Flags
        id: smoke-flags
        if: steps.check.outputs.effective_update_mode == 'patch-minor' || steps.check.outputs.effective_update_mode == 'all'
        run: |
          FORCE_FLAGS="$(bun run .github/scripts/derive-deps-smoke-flags.ts --base origin/main)"
          echo "force_flags=$FORCE_FLAGS" >> "$GITHUB_OUTPUT"

      - name: Regenerate Dependency Report
        if: steps.check.outputs.effective_update_mode == 'patch-minor' || steps.check.outputs.effective_update_mode == 'all'
        run: |
          cd packages/template-generator

          if [ -n "${{ inputs.ecosystem }}" ]; then
            bun run scripts/check-deps.ts --markdown --ecosystem "${{ inputs.ecosystem }}" > ../deps-report.md || true
          else
            bun run scripts/check-deps.ts --markdown > ../deps-report.md || true
          fi

      - name: Determine Pending Changes
        id: pending
        run: |
          # A refreshed report alone is informational and must not create an
          # empty weekly dependency PR.
          if git diff --quiet -- . ':(exclude)packages/deps-report.md'; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Capture Final Report
        id: final-report
        run: |
          {
            echo 'report<<EOF'
            cat packages/deps-report.md
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Disable Git Hooks For Automation Commit
        if: steps.pending.outputs.has_changes == 'true' && (steps.check.outputs.effective_update_mode == 'patch-minor' || steps.check.outputs.effective_update_mode == 'all')
        run: git config core.hooksPath /dev/null

      - name: Create Pull Request
        id: cpr
        if: steps.pending.outputs.has_changes == 'true' && (steps.check.outputs.effective_update_mode == 'patch-minor' || steps.check.outputs.effective_update_mode == 'all')
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.PAT_WORKFLOW }}
          commit-message: "chore(deps): update dependency versions"
          title: "chore(deps): Update dependency versions"
          body: |
            ## Dependency Version Updates

            This PR was automatically generated by the dependency version check workflow.

            - Mode: `${{ steps.check.outputs.effective_update_mode }}`
            - Downgrades detected in check report: `${{ steps.check.outputs.downgrade_count }}`
            - Note: Template versions, snapshots, and the dependency report were regenerated after applying updates.
            - Policy-blocked major updates: `${{ steps.check.outputs.blocked_major_count }}`
            - Note: `all` mode only applies major changes explicitly allowlisted in the repository policy; their smoke test runs automatically.

            ${{ steps.final-report.outputs.report }}

            ${{ steps.test-report.outputs.report }}

            ### Review Checklist
            - [ ] Review the version changes
            - [ ] Run `bun install` to update lockfile
            - [ ] Run tests to verify compatibility
            - [ ] Check for any breaking changes in major updates

            ---
            *Automated by [deps-check.yaml](.github/workflows/deps-check.yaml)*
          branch: deps/version-updates
          delete-branch: true
          labels: |
            dependencies
            automated

      - name: Post Summary
        run: |
          echo "## Dependency Check Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Event:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Mode:** ${{ steps.check.outputs.effective_update_mode }}" >> $GITHUB_STEP_SUMMARY
          echo "**Has Updates:** ${{ steps.check.outputs.has_updates }}" >> $GITHUB_STEP_SUMMARY
          echo "**Downgrades Detected:** ${{ steps.check.outputs.downgrade_count }}" >> $GITHUB_STEP_SUMMARY
          echo "**Major Updates:** ${{ steps.check.outputs.has_major_updates }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Report" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.final-report.outputs.report }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  deps-smoke:
    name: Dependency Update Smoke Test
    needs: check-versions
    if: needs.check-versions.outputs.has_pr_changes == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/smoke-test.yaml
    with:
      checkout_ref: deps/version-updates
      count: 40
      force_flags: ${{ needs.check-versions.outputs.smoke_force_flags }}
    secrets: inherit

  deps-smoke-report:
    name: Post Dependency Smoke Report
    needs: [check-versions, deps-smoke]
    if: always() && needs.check-versions.outputs.has_pr_changes == 'true' && needs.check-versions.outputs.pull_request_number != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      # This job runs inside the scheduled automation run, so the smoke result
      # would never appear on the PR; publish it as a status the PR can gate on.
      - name: Publish Smoke Status On Dependency Head
        env:
          GH_TOKEN: ${{ secrets.PAT_WORKFLOW }}
          SMOKE_RESULT: ${{ needs.deps-smoke.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          HEAD_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/deps/version-updates" --jq .object.sha)
          STATE=failure
          DESCRIPTION="Targeted dependency smoke failed"
          if [ "$SMOKE_RESULT" = "success" ]; then
            STATE=success
            DESCRIPTION="Targeted dependency smoke passed"
          fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            -f state="$STATE" \
            -f context="Dependency Update Smoke Test" \
            -f description="$DESCRIPTION" \
            -f target_url="$RUN_URL"

      - name: Post Smoke Summary To Pull Request
        env:
          GH_TOKEN: ${{ secrets.PAT_WORKFLOW }}
          PR_NUMBER: ${{ needs.check-versions.outputs.pull_request_number }}
          SMOKE_SUMMARY: ${{ needs.deps-smoke.outputs.summary }}
        run: |
          if [ -z "$SMOKE_SUMMARY" ]; then
            SMOKE_SUMMARY='## Smoke Test Results

            The smoke workflow did not return a summary. Inspect its job log and artifacts.'
          fi
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$SMOKE_SUMMARY"

  major-deps-smoke:
    name: Major Deps Smoke Test
    needs: check-versions
    if: needs.check-versions.outputs.has_major_updates == 'true' && needs.check-versions.outputs.has_pr_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: deps/version-updates

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache Dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.bun/install/cache
          key: major-smoke-${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            major-smoke-${{ runner.os }}-bun-

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Build Packages
        run: |
          bun run --cwd packages/types build
          bun run --cwd packages/template-generator build
          bun run --cwd apps/cli build

      - name: Install Playwright
        run: bunx playwright install chromium --with-deps

      - name: Run Major Deps Smoke Test
        run: |
          bun run testing/smoke-test.ts \
            --major-deps \
            --major-deps-packages "${{ needs.check-versions.outputs.major_packages }}" \
            --dev-check \
            --route-check \
            --output testing/.smoke-output

      - name: Post Step Summary
        if: always()
        run: |
          if [ -f testing/.smoke-output/summary.md ]; then
            cat testing/.smoke-output/summary.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: major-deps-smoke-results
          path: testing/.smoke-output/
          include-hidden-files: true
          retention-days: 7
