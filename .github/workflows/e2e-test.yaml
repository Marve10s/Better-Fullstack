name: E2E & Integration Tests

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      run_e2e:
        description: "Run CLI runtime and roundtrip tests"
        type: boolean
        default: true
      run_smoke_strict:
        description: "Run strict smoke tests (dev-check blocking)"
        type: boolean
        default: true
      run_playwright:
        description: "Run Playwright web builder tests"
        type: boolean
        default: true
      run_benchmark_deep:
        description: "Run deep smoke tests for the AI search benchmark template"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-runtime:
    name: E2E Runtime Tests
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_e2e }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: mysql
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -pmysql"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: astral-sh/setup-uv@v5

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.18"

      - uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.bun/install/cache
          key: deps-${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: deps-${{ runner.os }}-bun-

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Build Packages
        run: |
          bun run --cwd packages/types build
          bun run --cwd packages/project-lifecycle build
          bun run --cwd packages/template-generator build
          bun run --cwd apps/cli build

      - name: Run E2E Tests
        env:
          E2E: "1"
        run: bun test ./apps/cli/test/support/e2e-utils.test.ts ./apps/cli/test/e2e/e2e.e2e.ts --timeout 600000

      - name: Upload E2E Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: apps/cli/.smoke-e2e/
          if-no-files-found: warn
          retention-days: 7

  smoke-strict-core:
    name: Strict Smoke Tests (Core ${{ matrix.shard }}/3)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_smoke_strict }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: mysql
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -pmysql"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # The pnpm preset (hono-node-prisma-docker) installs with pnpm on the host.
      - name: Setup pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.20.0 --activate

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: astral-sh/setup-uv@v5

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.18"

      - uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.bun/install/cache
          key: deps-${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: deps-${{ runner.os }}-bun-

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Build Packages
        run: |
          bun run --cwd packages/types build
          bun run --cwd packages/project-lifecycle build
          bun run --cwd packages/template-generator build
          bun run --cwd apps/cli build

      - name: Run Strict Smoke Tests (Core)
        run: |
          bun run testing/smoke-test.ts \
            --preset pr-core \
            --partition ${{ matrix.shard }}/3 \
            --dev-check \
            --strict \
            --output testing/.smoke-output/core-${{ matrix.shard }}

      - name: Post Summary
        if: always()
        run: |
          if [ -f testing/.smoke-output/core-${{ matrix.shard }}/summary.md ]; then
            cat testing/.smoke-output/core-${{ matrix.shard }}/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-strict-core-results-${{ matrix.shard }}
          path: testing/.smoke-output/core-${{ matrix.shard }}/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  smoke-strict-broad:
    name: Strict Smoke Tests (Broad ${{ matrix.shard }}/8)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_smoke_strict }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: mysql
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -pmysql"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      # The broad matrix once exhausted the runner disk when all presets ran
      # in one job (run 29582988254 died with "No space left on device"). Each
      # shard now runs ~1/8 of the presets and cleans up per project, but the
      # big preinstalled toolchains this job never uses (~25GB: Android SDK,
      # GHC, CodeQL, Swift, boost) are still dropped as a safety margin.
      # No `docker image prune` here: it alone took 3-4 minutes per shard in
      # the first sharded run, dwarfing the ~4 projects each shard installs.
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/boost
          df -h /
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: astral-sh/setup-uv@v5

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.11"
          bundler: "4.0.21"

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.18"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.bun/install/cache
          key: deps-${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: deps-${{ runner.os }}-bun-

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Build Packages
        run: |
          bun run --cwd packages/types build
          bun run --cwd packages/project-lifecycle build
          bun run --cwd packages/template-generator build
          bun run --cwd apps/cli build

      - name: Run Strict Smoke Tests (Broad)
        run: |
          bun run testing/smoke-test.ts \
            --preset pr-broad \
            --partition ${{ matrix.shard }}/8 \
            --dev-check \
            --strict \
            --output testing/.smoke-output/broad-${{ matrix.shard }}

      - name: Post Summary
        if: always()
        run: |
          if [ -f testing/.smoke-output/broad-${{ matrix.shard }}/summary.md ]; then
            cat testing/.smoke-output/broad-${{ matrix.shard }}/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-strict-broad-results-${{ matrix.shard }}
          path: testing/.smoke-output/broad-${{ matrix.shard }}/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  benchmark-deep-smoke:
    name: Deep Smoke Test (AI Search Workbench)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_benchmark_deep }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.bun/install/cache
          key: deps-${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: deps-${{ runner.os }}-bun-

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Build Packages
        run: |
          bun run --cwd packages/types build
          bun run --cwd packages/project-lifecycle build
          bun run --cwd packages/template-generator build
          bun run --cwd apps/cli build

      - name: Install Playwright
        run: bunx playwright install chromium --with-deps

      - name: Run Deep Smoke Test
        run: bun run test:smoke:benchmark-deep

      - name: Post Summary
        if: always()
        run: |
          if [ -f testing/.smoke-output/benchmark-deep/summary.md ]; then
            cat testing/.smoke-output/benchmark-deep/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-deep-smoke-results
          path: testing/.smoke-output/benchmark-deep/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  playwright:
    name: Playwright Web Builder Tests
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_playwright }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.bun/install/cache
          key: deps-${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: deps-${{ runner.os }}-bun-

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Build Packages
        run: |
          bun run --cwd packages/types build
          bun run --cwd packages/template-generator build

      - name: Install Playwright Browsers
        working-directory: apps/web
        run: bunx playwright install --with-deps chromium

      - name: Run Playwright Tests
        working-directory: apps/web
        run: bunx playwright test --grep-invert @webcontainer-proof
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Upload Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/test-results/
          if-no-files-found: warn
          retention-days: 7

  web-command-roundtrip:
    name: Web Command Roundtrip
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_e2e }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.bun/install/cache
          key: deps-${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: deps-${{ runner.os }}-bun-

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Build Packages
        run: |
          bun run --cwd packages/types build
          bun run --cwd packages/project-lifecycle build
          bun run --cwd packages/template-generator build
          bun run --cwd apps/cli build

      - name: Run Web Command Roundtrip Tests
        run: bun test apps/cli/test/e2e/web-command-roundtrip.test.ts --timeout 600000

      - name: Upload Roundtrip Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-command-roundtrip-results
          path: apps/cli/.smoke-web-command-roundtrip/
          if-no-files-found: warn
          retention-days: 7

  benchmark-install-path:
    name: Benchmark CLI Install Path
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_e2e }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: actions/cache@v4
        with:
          path: |
            node_modules
          key: deps-${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: deps-${{ runner.os }}-bun-

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Build Packages
        run: |
          bun run --cwd packages/types build
          bun run --cwd packages/project-lifecycle build
          bun run --cwd packages/template-generator build
          bun run --cwd apps/cli build

      - name: Run Benchmark Install Path Test
        run: bun test apps/cli/test/e2e/benchmark-install-path.test.ts --timeout 900000

      - name: Upload Install Path Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-install-path-results
          path: apps/cli/.smoke-benchmark-install-path/
          if-no-files-found: warn
          retention-days: 7

  package-manager-default-matrix:
    name: Package Manager Default Matrix
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_e2e }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: actions/cache@v4
        with:
          path: |
            node_modules
          key: deps-${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: deps-${{ runner.os }}-bun-

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Enable Corepack Managers
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate
          corepack prepare yarn@stable --activate

      - name: Build Packages
        run: |
          bun run --cwd packages/types build
          bun run --cwd packages/project-lifecycle build
          bun run --cwd packages/template-generator build
          bun run --cwd apps/cli build

      - name: Run Package Manager Matrix
        run: bun test apps/cli/test/e2e/default-package-manager-matrix.test.ts --timeout 900000

      - name: Upload Package Manager Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-manager-default-matrix-results
          path: apps/cli/.smoke-default-package-managers/
          if-no-files-found: warn
          retention-days: 7
