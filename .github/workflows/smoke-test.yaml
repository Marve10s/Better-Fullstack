name: Smoke Test

on:
  workflow_call:
    inputs:
      seed:
        description: "PRNG seed override (default: caller commit SHA)"
        required: false
        type: string
      ecosystem:
        description: "Single ecosystem to test (leave empty for all)"
        required: false
        type: string
      count:
        description: "Number of combos to generate"
        required: false
        type: number
        default: 14
      force_flags:
        description: "Additional force flags passed to the smoke harness"
        required: false
        type: string
      checkout_ref:
        description: "Git ref containing the generator changes to test"
        required: false
        type: string
    outputs:
      summary:
        description: "Markdown smoke-test summary"
        value: ${{ jobs.smoke-summary.outputs.summary }}
  push:
    branches: [main]
    paths:
      - "packages/types/**"
      - "packages/template-generator/**"
      - "apps/cli/src/**"
      - "testing/**"
      - ".github/workflows/smoke-test.yaml"
  schedule:
    - cron: "0 3 * * *" # Nightly at 3am UTC
  workflow_dispatch:
    inputs:
      seed:
        description: "PRNG seed override (default: commit SHA)"
        required: false
        type: string
      ecosystem:
        description: "Ecosystem to test"
        required: false
        type: choice
        default: all
        options:
          - all
          - typescript
          - rust
          - python
          - go
          - java
          - react-native
          - elixir
      count:
        description: "Number of combos to generate"
        required: false
        type: number
        default: 14
      force_flags:
        description: "Additional force flags passed to the smoke harness"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.event_name }}-${{ inputs.checkout_ref || github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke Test (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: mysql
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -pmysql"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          # Pinned to 2.8.x: Deno 2.9.0 (2026-06-25) regressed npm: specifier
          # resolution in the vite/rollup build, breaking the Fresh frontend
          # ("Rollup failed to resolve import npm:preact@^10.29.1" from
          # @fresh/core). 2.8.3 builds clean. Revisit once 2.9.x fixes it.
          deno-version: v2.8.x

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Setup Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python + uv
        uses: astral-sh/setup-uv@v5

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: Setup Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.18"

      - name: Cache Dependencies
        uses: actions/cache@v4
        id: cache-deps
        with:
          path: |
            node_modules
            ~/.bun/install/cache
          key: deps-${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            deps-${{ runner.os }}-bun-

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Build Packages
        run: |
          cd packages/types && bun run build
          cd ../project-lifecycle && bun run build
          cd ../template-generator && bun run build
          cd ../../apps/cli && bun run build

      - name: Run Smoke Tests
        env:
          INPUT_SEED: ${{ inputs.seed }}
          FALLBACK_SEED: ${{ github.sha }}
          SMOKE_ECOSYSTEM: ${{ inputs.ecosystem }}
          SMOKE_COUNT: ${{ inputs.count || '14' }}
          FORCE_FLAGS: ${{ inputs.force_flags }}
          # Build-only placeholders; smoke tests do not call PayPal.
          PAYPAL_CLIENT_ID: smoke-test-client-id
          PAYPAL_CLIENT_SECRET: smoke-test-client-secret
        run: |
          SEED="${INPUT_SEED:-$FALLBACK_SEED}"

          ECOSYSTEM_FLAG=""
          if [ -n "$SMOKE_ECOSYSTEM" ] && [ "$SMOKE_ECOSYSTEM" != "all" ]; then
            ECOSYSTEM_FLAG="--ecosystem $SMOKE_ECOSYSTEM"
          fi

          # Split the requested combo count across the 3 matrix shards; the
          # harness generates count*shards combos from the same seed and each
          # shard runs its own partition, so coverage is unchanged.
          SHARD_COUNT=$(( (SMOKE_COUNT + 2) / 3 ))

          bun run testing/smoke-test.ts \
            --seed "$SEED" \
            --count "$SHARD_COUNT" \
            --partition ${{ matrix.shard }}/3 \
            $ECOSYSTEM_FLAG \
            $FORCE_FLAGS \
            --output testing/.smoke-output

      - name: Post Step Summary
        if: always()
        run: |
          if [ -f testing/.smoke-output/summary.md ]; then
            cat testing/.smoke-output/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: smoke-results-${{ matrix.shard }}
          path: |
            testing/.smoke-output/
            !testing/.smoke-output/**/node_modules/**
            !testing/.smoke-output/**/.git/**
            !testing/.smoke-output/**/target/**
            !testing/.smoke-output/**/dist/**
            !testing/.smoke-output/**/build/**
            !testing/.smoke-output/**/.next/**
            !testing/.smoke-output/**/.expo/**
            !testing/.smoke-output/**/.turbo/**
            !testing/.smoke-output/**/.venv/**
            !testing/.smoke-output/**/__pycache__/**
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  # The sharded smoke jobs each upload their own summary; combine them so
  # callers keep receiving one workflow-level summary output.
  smoke-summary:
    name: Combine Smoke Summaries
    needs: smoke
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      summary: ${{ steps.combine.outputs.summary }}
    steps:
      - name: Download shard results
        uses: actions/download-artifact@v4
        with:
          pattern: smoke-results-*
          path: smoke-shards

      - name: Combine summaries
        id: combine
        run: |
          {
            echo 'summary<<EOF'
            found=0
            for file in smoke-shards/smoke-results-*/summary.md; do
              if [ -f "$file" ]; then
                cat "$file"
                echo
                found=1
              fi
            done
            if [ "$found" = "0" ]; then
              echo '## Smoke Test Results'
              echo
              echo 'The smoke harness did not produce a summary.'
            fi
            echo EOF
          } >> "$GITHUB_OUTPUT"
