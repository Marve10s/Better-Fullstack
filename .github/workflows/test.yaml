name: Lint, Test & Build

on:
  push:
    branches: [main, master]
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: test-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  release-guard:
    name: Release Guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Cache Dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.bun/install/cache
          key: deps-${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            deps-${{ runner.os }}-bun-

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Run Release Verification
        run: bun run test:release

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Cache Dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.bun/install/cache
          key: deps-${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            deps-${{ runner.os }}-bun-

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Build Core Packages
        run: |
          rm -rf packages/project-lifecycle/dist packages/types/dist packages/template-generator/dist
          bun run --filter=@better-fullstack/project-lifecycle build
          bun run --filter=@better-fullstack/types build
          bun run --filter=@better-fullstack/template-generator build

      - name: Validate Builder Tech Links
        run: bun run --cwd apps/web validate:tech-links

      - name: Validate Builder Tech Icons
        run: bun run --cwd apps/web validate:tech-icons

      - name: Run Lint
        run: bun run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          # Pinned to 2.8.x: Deno 2.9.0 (2026-06-25) regressed npm: specifier
          # resolution in the vite/rollup build, breaking the Fresh frontend
          # ("Rollup failed to resolve import npm:preact@^10.29.1" from
          # @fresh/core). 2.8.3 builds clean. Revisit once 2.9.x fixes it.
          deno-version: v2.8.x

      - name: Cache Dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.bun/install/cache
          key: deps-${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            deps-${{ runner.os }}-bun-

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Run Turbo Tests
        run: bun run test

  web-build:
    name: Web Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Cache Dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.bun/install/cache
          key: deps-${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            deps-${{ runner.os }}-bun-

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Build Web (Vercel Parity)
        run: bun run build:web
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"

      - name: Check Web Performance Budget
        id: web-performance
        run: bun run --cwd apps/web perf:check

      - name: Summarize Web Performance
        if: always() && steps.web-performance.outcome != 'skipped'
        run: |
          if [ -f apps/web/reports/performance/summary.md ]; then
            cat apps/web/reports/performance/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Web performance report could not be generated. See the budget step logs.' >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    name: Build Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [release-guard, lint, test, web-build]
    if: ${{ !cancelled() }}
    steps:
      # Keep the existing required check red when a prerequisite fails.
      - name: Require successful checks
        if: >-
          needs.release-guard.result != 'success' ||
          needs.lint.result != 'success' ||
          needs.test.result != 'success' ||
          needs.web-build.result != 'success'
        run: |
          echo 'All required checks must pass.' >&2
          exit 1
