name: PR Preview Build

on:
  pull_request:
    types: [labeled, synchronize]

# Untrusted PR code runs here. Keep this workflow read-only and secret-free.
permissions:
  contents: read

concurrency:
  group: pr-preview-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-preview:
    name: Build untrusted preview artifacts
    if: >-
      (github.event.action == 'labeled' && github.event.label.name == 'preview') ||
      (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'preview'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PR code without credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install and validate
        run: |
          bun install --frozen-lockfile
          bun run test:plugin-bundle
        env:
          BTS_TELEMETRY: 0

      - name: Generate version from the trusted base revision
        id: version
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]
          BASE_VERSION=$(git show "${BASE_SHA}:apps/cli/package.json" | jq -r '.version' | sed -E 's/^([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          [[ "$BASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          PREVIEW_VERSION="${BASE_VERSION}-pr${PR_NUMBER}.sha${COMMIT_SHA}"
          echo "version=$PREVIEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Version and build packages
        env:
          PREVIEW_VERSION: ${{ steps.version.outputs.version }}
          BTS_TELEMETRY: 0
        run: |
          set -euo pipefail
          jq --arg v "$PREVIEW_VERSION" '.version = $v' packages/types/package.json > packages/types/package.json.tmp
          mv packages/types/package.json.tmp packages/types/package.json
          bun run --cwd packages/types build
          bun run --cwd packages/project-lifecycle build
          jq --arg v "$PREVIEW_VERSION" '.version = $v | .dependencies["@better-fullstack/types"] = $v' packages/template-generator/package.json > packages/template-generator/package.json.tmp
          mv packages/template-generator/package.json.tmp packages/template-generator/package.json
          bun run --cwd packages/template-generator build
          jq --arg v "$PREVIEW_VERSION" '.version = $v | .dependencies["@better-fullstack/types"] = $v | .dependencies["@better-fullstack/template-generator"] = $v' apps/cli/package.json > apps/cli/package.json.tmp
          mv apps/cli/package.json.tmp apps/cli/package.json
          bun run --cwd apps/cli build
          jq --arg v "$PREVIEW_VERSION" '.version = $v | .dependencies["create-better-fullstack"] = $v' packages/create-bfs/package.json > packages/create-bfs/package.json.tmp
          mv packages/create-bfs/package.json.tmp packages/create-bfs/package.json

      - name: Pack inert artifacts
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/preview-packages
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT_DIR"
          pack_package() {
            local package_dir="$1" output_name="$2" result filename
            result=$(mktemp "${RUNNER_TEMP}/npm-pack.XXXXXX")
            npm pack --ignore-scripts --json --pack-destination "$ARTIFACT_DIR" "$package_dir" > "$result"
            filename=$(jq -r 'if length == 1 then .[0].filename else empty end' "$result")
            [[ -n "$filename" && "$filename" != */* && -f "$ARTIFACT_DIR/$filename" ]]
            mv -- "$ARTIFACT_DIR/$filename" "$ARTIFACT_DIR/$output_name"
          }
          pack_package packages/types types.tgz
          pack_package packages/template-generator template-generator.tgz
          pack_package apps/cli cli.tgz
          pack_package packages/create-bfs create-bfs.tgz

      - name: Upload exact-run artifact
        uses: actions/upload-artifact@v4
        with:
          name: preview-packages-${{ github.run_id }}
          path: ${{ runner.temp }}/preview-packages/*.tgz
          if-no-files-found: error
          retention-days: 3
