name: Deploy Convex Backend

on:
  push:
    branches: [main]
    paths:
      - "packages/backend/**"
      - ".github/workflows/backend-deploy.yaml"
  workflow_dispatch:

concurrency:
  group: backend-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.bun/install/cache
          key: deps-${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            deps-${{ runner.os }}-bun-

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      # Without the secret the deploy cannot run. Skip loudly rather than
      # failing every push, but never let a broken push look deployed.
      - name: Check deploy credentials
        id: guard
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          if [ -z "$CONVEX_DEPLOY_KEY" ]; then
            echo "::warning::CONVEX_DEPLOY_KEY is not set - skipping deploy. The backend stays on its previous version."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy Convex Functions
        if: steps.guard.outputs.skip != 'true'
        working-directory: packages/backend
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: bunx convex deploy --message "${{ github.sha }}"
