name: Codebase Dependency Update

on:
  schedule:
    # Run every Monday at 10am UTC
    - cron: "0 10 * * 1"
  workflow_dispatch:
    inputs:
      update_mode:
        description: "Update mode"
        type: choice
        options:
          - patch-minor
          - all
        default: "patch-minor"

concurrency:
  group: codebase-deps
  cancel-in-progress: true

jobs:
  update:
    name: Update Workspace Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
    outputs:
      has_pr_changes: ${{ steps.pending.outputs.has_changes }}
      pull_request_number: ${{ steps.cpr.outputs.pull-request-number }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Resolve Update Mode
        id: mode
        run: |
          MODE="${{ inputs.update_mode }}"
          if [ -z "$MODE" ]; then
            MODE="patch-minor"
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Selected mode: $MODE"

      - name: Install Dependencies
        run: bun install

      - name: Update Dependencies
        run: |
          bun update --latest
          for dir in apps/*/package.json packages/*/package.json; do
            ws="$(dirname "$dir")"
            if [ -f "$dir" ]; then
              echo "Updating $ws..."
              (cd "$ws" && bun update --latest) || true
            fi
          done

      - name: Revert Major Bumps (patch-minor mode)
        if: steps.mode.outputs.mode == 'patch-minor'
        run: |
          # Restore any package.json version specifiers that jumped a major
          # by comparing against the committed versions on this branch.
          git diff --name-only -- '*/package.json' 'package.json' | while IFS= read -r f; do
            if [ -f "$f" ]; then
              node -e "
                const fs = require('fs');
                const { execSync } = require('child_process');
                const current = JSON.parse(fs.readFileSync('$f', 'utf-8'));
                let original;
                try {
                  original = JSON.parse(execSync('git show HEAD:$f', { encoding: 'utf-8' }));
                } catch { process.exit(0); }

                function parseSemver(v) {
                  const clean = String(v).replace(/^[\^~>=<]+/, '');
                  const [core] = clean.split('-');
                  const [major, minor, patch] = (core || '').split('.').map(Number);
                  const prerelease = clean.includes('-');
                  return { major: major || 0, minor: minor || 0, patch: patch || 0, prerelease };
                }

                function isBreaking(oldV, newV) {
                  const o = parseSemver(oldV);
                  const n = parseSemver(newV);
                  if (n.prerelease) return true;
                  if (n.major > o.major) return true;
                  if (o.major === 0 && n.minor > o.minor) return true;
                  return false;
                }

                let reverted = false;
                for (const key of ['dependencies', 'devDependencies']) {
                  const orig = original[key] || {};
                  const curr = current[key] || {};
                  for (const [pkg, oldVer] of Object.entries(orig)) {
                    const newVer = curr[pkg];
                    if (!newVer || newVer === oldVer) continue;
                    if (isBreaking(oldVer, newVer)) {
                      curr[pkg] = oldVer;
                      reverted = true;
                    }
                  }
                }
                if (reverted) {
                  fs.writeFileSync('$f', JSON.stringify(current, null, 2) + '\n');
                }
              "
            fi
          done
          # Re-install to fix lockfile after any reverts
          bun install

      - name: Determine Pending Changes
        id: pending
        run: |
          if git diff --quiet -- \
            package.json \
            bun.lock \
            ':(glob)apps/*/package.json' \
            ':(glob)packages/*/package.json'; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Repository Verification
        id: full-tests
        if: steps.pending.outputs.has_changes == 'true'
        run: |
          set +e
          bun run --cwd packages/types build 2>&1 | tee "$RUNNER_TEMP/types-build.log"
          TYPES_BUILD_EXIT_CODE=${PIPESTATUS[0]}
          bun run --cwd packages/template-generator build 2>&1 | tee "$RUNNER_TEMP/template-generator-build.log"
          TEMPLATE_GENERATOR_BUILD_EXIT_CODE=${PIPESTATUS[0]}
          bun run lint 2>&1 | tee "$RUNNER_TEMP/lint.log"
          LINT_EXIT_CODE=${PIPESTATUS[0]}
          bun run test 2>&1 | tee "$RUNNER_TEMP/test.log"
          TEST_EXIT_CODE=${PIPESTATUS[0]}
          set -e
          BUILD_EXIT_CODE=0
          if [ "$TYPES_BUILD_EXIT_CODE" -ne 0 ] || [ "$TEMPLATE_GENERATOR_BUILD_EXIT_CODE" -ne 0 ]; then
            BUILD_EXIT_CODE=1
          fi
          cat "$RUNNER_TEMP/types-build.log" "$RUNNER_TEMP/template-generator-build.log" > "$RUNNER_TEMP/build.log"
          echo "build_exit_code=$BUILD_EXIT_CODE" >> "$GITHUB_OUTPUT"
          echo "lint_exit_code=$LINT_EXIT_CODE" >> "$GITHUB_OUTPUT"
          echo "test_exit_code=$TEST_EXIT_CODE" >> "$GITHUB_OUTPUT"
          if [ "$BUILD_EXIT_CODE" -eq 0 ] && [ "$LINT_EXIT_CODE" -eq 0 ] && [ "$TEST_EXIT_CODE" -eq 0 ]; then
            echo "exit_code=0" >> "$GITHUB_OUTPUT"
          else
            echo "exit_code=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Capture Test Verification Report
        id: test-report
        if: steps.pending.outputs.has_changes == 'true'
        run: |
          bun run .github/scripts/format-test-report.ts \
            "$RUNNER_TEMP/build.log" \
            "${{ steps.full-tests.outputs.build_exit_code }}" \
            '`bun run --cwd packages/types build` and `bun run --cwd packages/template-generator build`' > "$RUNNER_TEMP/build-verification.md"
          bun run .github/scripts/format-test-report.ts \
            "$RUNNER_TEMP/lint.log" \
            "${{ steps.full-tests.outputs.lint_exit_code }}" \
            '`bun run lint`' > "$RUNNER_TEMP/lint-verification.md"
          bun run .github/scripts/format-test-report.ts \
            "$RUNNER_TEMP/test.log" \
            "${{ steps.full-tests.outputs.test_exit_code }}" \
            '`bun run test`' > "$RUNNER_TEMP/test-verification.md"
          {
            echo '## Build verification'
            cat "$RUNNER_TEMP/build-verification.md"
            echo
            echo '## Lint verification'
            cat "$RUNNER_TEMP/lint-verification.md"
            echo
            echo '## Test verification'
            cat "$RUNNER_TEMP/test-verification.md"
          } > "$RUNNER_TEMP/verification-source.md"
          bun run .github/scripts/compose-markdown-report.ts \
            50000 \
            "$RUNNER_TEMP/verification-source.md" > "$RUNNER_TEMP/verification-report.md"
          {
            echo 'report<<EOF'
            cat "$RUNNER_TEMP/verification-report.md"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Disable Git Hooks For Automation Commit
        if: steps.pending.outputs.has_changes == 'true'
        run: git config core.hooksPath /dev/null

      - name: Create Pull Request
        id: cpr
        if: steps.pending.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.PAT_WORKFLOW }}
          commit-message: "chore(deps): update codebase dependencies"
          title: "chore(deps): update codebase dependencies"
          body: |
            ## Codebase Dependency Updates

            This PR updates workspace dependencies used by the repository codebase (`package.json` + `bun.lock`).

            - Update mode: `${{ steps.mode.outputs.mode }}`
            - Scope: root + all Bun workspaces (`--recursive`)

            ${{ steps.test-report.outputs.report }}

            ---
            *Automated by [codebase-deps.yaml](.github/workflows/codebase-deps.yaml)*
          branch: deps/codebase-updates
          delete-branch: true
          add-paths: |
            package.json
            bun.lock
            apps/*/package.json
            packages/*/package.json
          labels: |
            dependencies
            automated

  vercel-parity-build:
    name: Vercel-Parity Build (glibc 2.34)
    needs: update
    if: needs.update.outputs.has_pr_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container: amazonlinux:2023
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Install System Dependencies
        run: dnf install -y git tar gzip unzip libstdc++ which curl ca-certificates nodejs22

      - name: Checkout Dependency Branch
        uses: actions/checkout@v4
        with:
          ref: deps/codebase-updates

      - name: Install Bun
        run: |
          BUN_VERSION=$(node -p "require('./package.json').packageManager.split('@')[1]")
          curl -fsSL https://bun.sh/install | bash -s "bun-v$BUN_VERSION"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
          "$HOME/.bun/bin/bun" --version

      - name: Record Dependency Head
        id: dep-head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Run Vercel-Parity Build
        id: parity
        run: |
          set +e
          {
            bun install --frozen-lockfile &&
            bun run --cwd packages/types build &&
            bun run --cwd packages/template-generator build &&
            bun run --cwd apps/web build
          } 2>&1 | tee "$RUNNER_TEMP/vercel-parity.log"
          BUILD_EXIT_CODE=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$BUILD_EXIT_CODE" >> "$GITHUB_OUTPUT"

      # The job runs inside the scheduled automation run, so a failure would not
      # otherwise surface on the dependency PR; publish it as a commit status.
      - name: Publish Parity Status On Dependency Head
        if: always() && steps.parity.outputs.exit_code != ''
        env:
          GH_TOKEN: ${{ secrets.PAT_WORKFLOW }}
          HEAD_SHA: ${{ steps.dep-head.outputs.sha }}
          EXIT_CODE: ${{ steps.parity.outputs.exit_code }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          STATE=failure
          DESCRIPTION="Web build failed on glibc 2.34 (Amazon Linux 2023)"
          if [ "$EXIT_CODE" = "0" ]; then
            STATE=success
            DESCRIPTION="Web build passed on glibc 2.34 (Amazon Linux 2023)"
          fi
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            -d "{\"state\":\"$STATE\",\"context\":\"Vercel-Parity Build (glibc 2.34)\",\"description\":\"$DESCRIPTION\",\"target_url\":\"$RUN_URL\"}"

      - name: Format Vercel-Parity Report
        id: parity-report
        if: always() && steps.parity.outputs.exit_code != ''
        run: |
          bun run .github/scripts/format-vercel-parity-report.ts \
            "$RUNNER_TEMP/vercel-parity.log" \
            "${{ steps.parity.outputs.exit_code }}" > "$RUNNER_TEMP/vercel-parity-report.md"

      - name: Post Vercel-Parity Report To Pull Request
        if: always() && steps.parity.outputs.exit_code != ''
        env:
          GH_TOKEN: ${{ secrets.PAT_WORKFLOW }}
          PR_NUMBER: ${{ needs.update.outputs.pull_request_number }}
          REPORT_PATH: ${{ runner.temp }}/vercel-parity-report.md
        run: |
          bun -e '
            const body = await Bun.file(process.env.REPORT_PATH).text();
            const response = await fetch(
              `${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}/issues/${process.env.PR_NUMBER}/comments`,
              {
                method: "POST",
                headers: {
                  Accept: "application/vnd.github+json",
                  Authorization: `Bearer ${process.env.GH_TOKEN}`,
                  "X-GitHub-Api-Version": "2022-11-28",
                },
                body: JSON.stringify({ body }),
              },
            );
            if (!response.ok) throw new Error(`GitHub API returned ${response.status}: ${await response.text()}`);
          '

      - name: Fail On Vercel-Parity Build Error
        if: steps.parity.outputs.exit_code != '0'
        run: exit 1
