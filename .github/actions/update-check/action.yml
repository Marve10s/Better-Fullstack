name: Better Fullstack update check
description: Verify a deterministic project update and optionally open a receipt-backed pull request.

inputs:
  project-directory:
    description: Better Fullstack project directory inside the checked-out repository.
    required: false
    default: "."
  cli-version:
    description: Exact create-better-fullstack semantic version. Moving tags are rejected.
    required: true
  open-pull-request:
    description: Apply a fully eligible plan on a generated branch and open a pull request.
    required: false
    default: "false"
  fail-on-changes:
    description: Fail check-only mode when verified template changes are available.
    required: false
    default: "true"
  base-branch:
    description: Pull request base branch. Defaults to the triggering branch.
    required: false
    default: ""
  github-token:
    description: GitHub token used only when open-pull-request is true.
    required: false
    default: ""

outputs:
  decision:
    description: blocked, current, changes-detected, or pull-request-created.
    value: ${{ steps.update-check.outputs.decision }}
  has-changes:
    description: Whether the verified plan contained actionable template changes.
    value: ${{ steps.update-check.outputs.has-changes }}
  receipt-path:
    description: Local path to the update verification receipt.
    value: ${{ steps.update-check.outputs.receipt-path }}
  receipt-sha256:
    description: SHA-256 of the exact uploaded receipt bytes.
    value: ${{ steps.update-check.outputs.receipt-sha256 }}
  pull-request-url:
    description: Created pull request URL, or an empty string when no pull request was opened.
    value: ${{ steps.update-check.outputs.pull-request-url }}

runs:
  using: composite
  steps:
    - name: Install pinned Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: "1.3.12"

    - name: Verify Better Fullstack update
      id: update-check
      shell: bash
      env:
        INPUT_PROJECT_DIRECTORY: ${{ inputs.project-directory }}
        INPUT_CLI_VERSION: ${{ inputs.cli-version }}
        INPUT_OPEN_PULL_REQUEST: ${{ inputs.open-pull-request }}
        INPUT_FAIL_ON_CHANGES: ${{ inputs.fail-on-changes }}
        INPUT_BASE_BRANCH: ${{ inputs.base-branch }}
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
      run: bun "$GITHUB_ACTION_PATH/update-check.ts"

    - name: Upload update verification receipt
      if: ${{ always() && steps.update-check.outputs.receipt-path != '' }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: better-fullstack-update-check-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ steps.update-check.outputs.receipt-path }}
        if-no-files-found: error
        retention-days: 30
