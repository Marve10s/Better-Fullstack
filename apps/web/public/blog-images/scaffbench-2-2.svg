<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc" shape-rendering="crispEdges">
  <title id="title">ScaffBench 2.2</title>
  <desc id="desc">Brutalist poster showing full-stack projects moving from prompt to proof through thirteen specifications, three cold trials, and five validation gates.</desc>

  <rect width="1200" height="630" fill="#faf9f5"/>
