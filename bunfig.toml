[install]
linker = "isolated"
# Refuse to resolve registry versions younger than 48h: day-zero
# supply-chain margin, and keeps `bun update --latest` (codebase-deps
# workflow) off releases Yarn hardened mode would quarantine anyway.
minimumReleaseAge = 172800

[test]
coverage = true
# The text reporter streams a table of every source file to stdout; bun dies
# with "internal error (WriteFailed)" partway through it on CI. Nothing
# consumes coverage output, so lcov alone keeps the data without the crash.
coverageReporter = ["lcov"]
coverageSkipTestFiles = true  # default false

# Performance optimizations for matrix testing
# Preload test utilities for faster startup
preload = ["./apps/cli/test/validation-utils.ts"]

# Timeout per test (ms) - default is 5000
timeout = 30000

# Bail after N failures to fail fast
# bail = 5